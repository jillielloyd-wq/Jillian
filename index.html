<!DOCTYPE html>
<html>
<head>
    <title>My Styled Website</title>
    <style>
        /* This is where we change the look of the page */
        body {
            background-color: #f0f8ff; /* A nice light blue */
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; /* Changes the font */
            color: #333333; /* Dark grey text (easier to read than pure black) */
            text-align: center; /* Centers everything */
            padding: 50px;
        }

        h1 {
            color: #2e8b57; /* A sea-green color for the heading */
        }

        img {
            max-width: 300px; /* Keeps your image from being too huge */
            border-radius: 15px; /* Rounds the corners of your image */
            border: 5px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Styled Page!</h1>
    <p>I changed the font, the colors, and added an image below.</p>

    <img src="https://placedog.net/500" alt="A cute dog">

</body>
</html>
