<!DOCTYPE html>
<html>
<head>
    <title>My Cherry Blossom Site</title>
<style>
    body { 
        /* this is where I set the background color for my page, and where I adjusted the font, along with editing some of the spacing */
        
        /* A beautiful light cherry-blossom pink */ 
        background-color: #FFD1DC;  /* the color ID for the light-pink background */
        
        /* Setting the global font color to white */  /* White font color */
        color: #FFFFFF; 
        
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* example of fonts that are used */
        
        text-align: center; /* more spacing adjustments, so the website is more appealing */
        padding: 50px 20px;
        margin: 0;
    }

    h1 { 
        /* for my heading, this is the detail where I have my heading have a slight shadow so it is more visually appealing */
        font-size: 3.5rem; /* this is font size */
        
        /* Adding a very soft shadow so white text is easy to read */ /* The code for the shadow */
        text-shadow: 2px 2px 8px rgba(0,0,0,0.1); /* The measurements for the shadow */
        
        margin-bottom: 10px; /* A margin adjustment for organization */
    }

    p {
        font-size: 1.4rem; /* the text setting that I have set for my words in the paragraph */
        font-weight: 300; /* How the font looks */
        margin-bottom: 40px; /* More spacing for clarity */
    }

    .image-container { 
        /* This is the border around my photo */
        margin-top: 20px; /* The measurement for my margin's spacing */
    }

    img {
        max-width: 80%; 
        width: 600px;
        border-radius: 20px; 
        
        /* White border to match the font */ 
        border: 10px solid #FFFFFF; 
        
        box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
        transition: transform 0.4s ease; 
    }

    img:hover {
        transform: scale(1.02);
    }
</style>
</head>
<body>

    <h1>Cherry Blossoms</h1> <!--This is the title that is seen on the top of my page, telling what the website is about -->
    <p>Welcome to my beautiful, pink-themed website.</p> <!-- This is what writting would be displayed on the website, in a speech bubble or a blurb -->

    <div class="image-container"> <!-- This is the link for my photo -->
        <img src="http://googleusercontent.com/image_collection/image_retrieval/6460290320600075603_0" alt="Beautiful cherry blossoms in bloom">
    </div>

</body>
</html>
