<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Blossoms</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cherry Blossoms</h1>
    <p>Welcome to my beautiful, pink-themed website.</p>

    <div class="input-section">
        <input type="text" id="userName" placeholder="Enter your name..." />
        <button id="factButton">Welcome Me! 🌸</button>
    </div>

    <div id="nameDisplay"></div>
<div id="factDisplay" style="margin-top: 20px; font-style: italic; color: #ffe4e9; font-size: 1.1rem;"></div>
    <div class="image-container">
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=800&q=80" alt="Cherry Blossoms">
            <p class="caption">Beautiful Pink Blooms</p>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=800&q=80" alt="Japan Trees">
            <p class="caption">Spring in Japan</p>
        </div>
        <div class="photo-card">
            <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=800&q=80" alt="Park Path">
            <p class="caption">A Path of Petals</p>
        </div>
    </div>

    <div class="links-section">
        <a href="https://www.google.com" target="_blank">Learn More</a>
        <a href="https://www.instagram.com" target="_blank">Follow the Blossoms</a>
    </div>

    <script src="script.js"></script>

</body>
</html>
